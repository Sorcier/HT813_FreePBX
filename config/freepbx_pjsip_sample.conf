; ====================================================================
; Exemple de configuration PJSIP pour Trunk HT813 (FXO) et Extension (FXS)
; A adapter dans FreePBX (via l'interface graphique GUI) ou /etc/asterisk/
; ====================================================================

; --------------------------------------------------------------------
; 1. TRUNK PJSIP : HT813 FXO (Ligne Livebox)
; --------------------------------------------------------------------

[ht813-trunk]
type=endpoint
transport=0.0.0.0-udp
context=from-trunk
disallow=all
allow=alaw
aors=ht813-trunk
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
trust_id_inbound=yes
dtmf_mode=rfc4733
from_domain=10.10.10.5
callerid=04XXXXXXXX <04XXXXXXXX>

[ht813-trunk]
type=aor
contact=sip:10.10.10.6:5062 ; IP du HT813 et Port SIP FXO (P740)

[ht813-trunk]
type=identify
endpoint=ht813-trunk
match=10.10.10.6 ; IP du boitier HT813

; --------------------------------------------------------------------
; 2. EXTENSION PJSIP : 4000 (Port FXS - Téléphone "Salon")
; --------------------------------------------------------------------

[4000]
type=endpoint
context=from-internal
disallow=all
allow=alaw,ulaw
auth=4000-auth
aors=4000
direct_media=no

[4000-auth]
type=auth
auth_type=userpass
password=VOTRE_MOT_DE_PASSE_EXTENSION_ICI
username=4000

[4000]
type=aor
max_contacts=1
remove_existing=yes
